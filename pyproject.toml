[project]
name = "rnda"
version = "0.1.0"
description = "Research Novelty Discovery Agent — arXiv ingestion, parsing, and knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.1.0",
    "pymupdf>=1.24.0",
    "requests>=2.28.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "openai>=1.40.0",
    "reportlab>=4.0.0",
]

[project.scripts]
rnda-ingest = "rnda.ingest.cli:main"
rnda-kg = "rnda.kg.cli:main"
rnda-gap = "rnda.gap.cli:main"
rnda-web = "rnda.web.__main__:main"
# Vercel FastAPI: slim app without torch/sentence-transformers (see requirements-vercel.txt)
app = "rnda.web.server_vercel:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rnda*"]

[tool.setuptools.package-data]
rnda = [
  "web/templates/*.html",
  "web/static/*",
]
